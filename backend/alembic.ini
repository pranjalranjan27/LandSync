# ==============================================================================
# Layer: Database Migrations Config (alembic.ini)
# ALLOWED:
#   - Configure Alembic migration directory, logging formatters, and script templates.
# NOT ALLOWED:
#   - Do not hardcode dynamic production database credentials here; env.py will override sqlalchemy.url.
# ==============================================================================

[alembic]
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with the current directory
prepend_sys_path = .

# Timezone to use when generating timestamps in migration files
timezone = UTC

# Max length of characters for slug
truncate_slug_length = 40

# Version path separator
version_path_separator = os

# Set to 'true' to run the environment during the 'revision' command
revision_environment = false

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
