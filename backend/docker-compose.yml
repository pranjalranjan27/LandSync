# ==============================================================================
# Layer: Multi-Service Local Orchestration (docker-compose.yml)
# ALLOWED:
#   - Define multi-container local stack: PostgreSQL + PostGIS container and the FastAPI app container.
#   - Configure network links, volume persistence, and environment variable passes.
# NOT ALLOWED:
#   - Do not use in production without hardening passwords, removing dev bind-mounts, and using TLS.
# ==============================================================================

version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: landsync_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: landsync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d landsync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: landsync_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - upload_data:/app/uploads
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/landsync_db
      - JWT_SECRET_KEY=landsync_hackathon_super_secret_jwt_key_2026_change_in_prod
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - UPLOAD_DIR=/app/uploads
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  upload_data:
